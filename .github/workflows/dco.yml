name: DCO
on: pull_request
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for c in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author' (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
